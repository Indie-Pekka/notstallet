// Tap tempo: genomsnittet av upp till de 10 senaste tappen. En paus på mer än 2 s börjar om.
let tapResetT = null;
$('#mTap').onclick = () => {
  const t = performance.now();
  if (M.taps.length && t - M.taps[M.taps.length - 1] > 2000) M.taps = [];
  M.taps.push(t); if (M.taps.length > 10) M.taps.shift();
  if (M.taps.length >= 2) {
    const iv = []; for (let i = 1; i < M.taps.length; i++) iv.push(M.taps[i] - M.taps[i - 1]);
    // Släng enstaka slarviga tap (mer än 35 % från medianen) innan genomsnittet räknas
    const med = iv.slice().sort((x, y) => x - y)[Math.floor(iv.length / 2)];
    const good = iv.filter(x => Math.abs(x - med) <= med * 0.35);
    const use = good.length ? good : iv;
    setBpm(60000 / (use.reduce((x, y) => x + y, 0) / use.length));
  }
  $('#mTap').textContent = M.taps.length > 1 ? `Tap (${M.taps.length})` : 'Tap';
  clearTimeout(tapResetT); tapResetT = setTimeout(() => { $('#mTap').textContent = 'Tap'; }, 2000);
};
$('#mSaveTempo').onclick = () => {
  const id = V.queue[V.qi], n = S.noter[id]; if (!n) return;
  n.tempoKoll = TEMPO_V; // läs aldrig av noten igen när Hugo själv har bestämt
  if (n.tempo === M.bpm) { delete n.tempo; delete n.tempoSrc; toast('Sparat tempo borttaget för noten'); }
  else { n.tempo = M.bpm; delete n.tempoSrc; toast(`Tempo ${M.bpm} sparat för ”${n.titel}”`); }
  writeNot(id); renderMetro();
};
// Läs av en tempoangivelse (t.ex. "♩ = 98") högst upp på första sidan – bara första gången noten öppnas.
// MuseScore lägger ofta varje tecken som en egen textbit, så bitarna fogas ihop efter hur nära de står.
const TEMPO_V = 2;
async function topText(doc){
  const page = await doc.getPage(1);
  const vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  const items = tc.items.filter(it => it.str && it.str.trim()).map(it => {
    const t = it.transform, h = Math.abs(it.height) || Math.hypot(t[2], t[3]) || 10;
    return { s: it.str, x: t[4], y: vp.height - t[5], w: it.width || 0, h };
  }).filter(it => it.y < vp.height * 0.45);
  items.sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = [];
  for (const it of items) {
    const ln = lines.find(l => Math.abs(l.y - it.y) < Math.max(3, it.h * 0.6));
    if (ln) ln.items.push(it); else lines.push({ y: it.y, items: [it] });
  }
  return lines.map(l => {
    l.items.sort((a, b) => a.x - b.x);
    let out = '', prev = null;
    for (const it of l.items) {
      if (prev) out += (it.x - (prev.x + prev.w) > Math.max(prev.h, it.h) * 0.25) ? ' ' : '';
      out += it.s; prev = it;
    }
    return out;
  }).join('\n');
}
function findTempo(text){
  const t = text.replace(/[＝꞊]/g, '=').replace(/[ \t\u00a0]+/g, ' ');
  const pats = [
    /=\s*(?:c(?:a|irca)?\.?\s*)?(\d(?:\s?\d){1,2})(?!\s?\d)/i,
    /\b(?:bpm|m\.?\s?m\.?)\s*=?\s*(\d(?:\s?\d){1,2})(?!\s?\d)/i,
    /(?:^|\s)(\d(?:\s?\d){1,2})\s*bpm\b/im,
  ];
  for (const re of pats) {
    const m = t.match(re);
    if (m) { const v = +m[1].replace(/\s/g, ''); if (v >= 30 && v <= 260) return v; }
  }
  return null;
}
async function detectTempo(doc){ try { return findTempo(await topText(doc)); } catch { return null; } }
async function autoTempo(doc, id){
  const n = S.noter[id]; if (!n || n.tempo || (n.tempoKoll || 0) >= TEMPO_V) return;
  const v = await detectTempo(doc);
  const m = S.noter[id]; if (!m || m.tempo || (m.tempoKoll || 0) >= TEMPO_V) return;
  m.tempoKoll = TEMPO_V;
  if (v) { m.tempo = v; m.tempoSrc = 'not'; }
  writeNot(id);
  if (v && V.open && V.queue[V.qi] === id) { applyNoteTempo(m); setTimeout(() => { if (V.open && V.queue[V.qi] === id) toast(`♩ = ${v} lästes från noten`); }, 1400); }
}
// Manuellt från ⋯: läs av igen och visa vad appen ser om inget hittas
async function rereadTempo(){
  const id = V.queue[V.qi], n = S.noter[id]; if (!n) return;
  let text = '', v = null;
  try { const doc = await getDoc(id); text = await topText(doc); v = findTempo(text); } catch {}
  n.tempoKoll = TEMPO_V;
  if (v) { n.tempo = v; n.tempoSrc = 'not'; writeNot(id); applyNoteTempo(n); toast(`♩ = ${v} lästes från noten`); return; }
  writeNot(id);
  const snippet = text.trim() ? text.trim().slice(0, 400) : '';
  openModal(`<h2>Ingen tempoangivelse hittades</h2>
    <p>${snippet ? 'Det här är texten appen kan läsa högst upp på första sidan:' : 'Appen kan inte läsa någon text högst upp på första sidan. Noten är troligen inskannad, eller så är texten sparad som grafik.'}</p>
    ${snippet ? `<pre style="white-space:pre-wrap;background:#f3efe8;border-radius:10px;padding:10px;font-size:13px;max-height:40vh;overflow:auto">${esc(snippet)}</pre>` : ''}
    <div class="actions"><button class="btn primary" id="rtOk">OK</button></div>`);
  $('#rtOk').onclick = closeModal;
}

// Byt till notens sparade tempo när en ny not visas (även mitt i en låtlista)
function applyNoteTempo(n){ if (n && n.tempo && n.tempo !== M.bpm) { M.bpm = n.tempo; renderMetro(); if (M.on) toast(`Tempo ${M.bpm}`); } else renderMetro(); }

/* ---------- Zoom: nyp med två fingrar, spara per not ---------- */
function curOrient(){ const { W, H } = stageSize(); return W > H ? 'ligg' : 'sta'; }
function savedZoom(n){ return (n && n.zoom && n.zoom[curOrient()]) || null; }
function updateZoomPill(){
  const n = S.noter[V.queue[V.qi]], sz = savedZoom(n), savedZ = sz ? sz.z : 1;
  const show = ZOOM_ON && V.open && !wrap.hidden && Math.abs(V.zoom - savedZ) > 0.01;
  $('#zoomPill').hidden = !show;
  if (show) $('#zoomTxt').textContent = `Zoom ${Math.round(V.zoom * 100)} %`;
}
$('#zoomSave').onclick = () => {
  const id = V.queue[V.qi], n = S.noter[id]; if (!n) return;
  const o = curOrient(), z = { ...(n.zoom || {}) };
  if (Math.abs(V.zoom - 1) > 0.01) z[o] = { z: Math.round(V.zoom * 100) / 100, x: V.wide ? Math.min(1, Math.max(0, V.offX / V.minX)) : 0.5 };
  else delete z[o];
  n.zoom = Object.keys(z).length ? z : undefined;
  if (!n.zoom) delete n.zoom;
  writeNot(id); updateZoomPill();
  toast(`Zoomen sparad för den här noten (${o === 'ligg' ? 'liggande' : 'stående'})`);
};
$('#zoomReset').onclick = () => {
  const sz = savedZoom(S.noter[V.queue[V.qi]]);
  V.zoom = sz ? sz.z : 1; V.offXFrac = sz ? sz.x : 0.5; V.applyFrac = true;
  showPage({ quiet: true, keepSeg: true });
};
function resetZoomToOriginal(){
  const id = V.queue[V.qi], n = S.noter[id];
  if (n && n.zoom) { delete n.zoom; writeNot(id); }
  V.zoom = 1; V.applyFrac = true; showPage({ quiet: true, keepSeg: true });
  toast('Noten visas i originalstorlek');
}
const tdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function startPinch(){
  const [a, b] = [...V.touches.values()];
  V.gesture = null; stopInertia();
  wrap.classList.remove('anim');
  const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  V.pinch = { d0: Math.max(10, tdist(a, b)), m0: m, z0: V.zoom, ox0: V.wide ? V.offX : V.minX, oy0: V.offY, f: 1, tx: V.wide ? V.offX : V.minX, ty: V.offY };
}
function movePinch(){
  const P = V.pinch, [a, b] = [...V.touches.values()]; if (!a || !b) return;
  const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  const f = Math.min(4 / P.z0, Math.max(0.5 / P.z0, tdist(a, b) / P.d0));
  const px = P.m0.x - P.ox0, py = P.m0.y - P.oy0;
  P.f = f; P.tx = m.x - px * f; P.ty = m.y - py * f;
  wrap.style.transform = `translate(${P.tx}px, ${P.ty}px) scale(${f})`;
}
function endPinch(){
  const P = V.pinch; V.pinch = null; if (!P) return;
  const z1 = Math.min(4, Math.max(0.5, P.z0 * P.f));
  if (Math.abs(z1 - P.z0) < 0.02) { placeWrap(true); return; }
  V.zoom = z1; V.pendingOff = { x: P.tx, y: P.ty };

}

// Bläddringseffekt: gör det tydligt att noten bytte vy. Inställning: glid, blink, båda eller av.
const FLIP_FX = [['glid', 'Glid – sidan glider in'], ['blink', 'Blink – skärmen blinkar till'], ['bada', 'Glid och blink'], ['av', 'Ingen effekt']];
function flipMode(){ const f = S.settings.flip; return FLIP_FX.some(x => x[0] === f) ? f : 'glid'; }
// Startar blinket direkt och svarar om rörelsen ska glida
function flipFx(dir){
  const f = flipMode();
  if (f === 'blink' || f === 'bada') flash(dir);
  return f === 'glid' || f === 'bada';
}
function flash(dir){
  const el = $('#vflash');
  el.style.background = `linear-gradient(${dir > 0 ? 'to left' : 'to right'}, rgba(138,63,28,.45), rgba(138,63,28,.12) 45%, rgba(138,63,28,.12))`;
  try { el.getAnimations().forEach(a => a.cancel()); el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' }); } catch {}
}
function slideIn(dir){
  const { W } = stageSize(), dx = Math.round(Math.min(W * 0.3, 280)) * (dir > 0 ? 1 : -1);
  const base = wrap.style.transform;
  try { V.slideAnim = wrap.animate([{ transform: `${base} translateX(${dx}px)`, opacity: 0.3 }, { transform: base, opacity: 1 }], { duration: 280, easing: 'cubic-bezier(.2,.75,.25,1)' });
    V.slideAnim.onfinish = () => { V.slideAnim = null; }; } catch {}
}

function go(delta, fromPan){
  if (V.stroke) return;
  if (!wrap.hidden && V.tall && !fromPan) {
    stopInertia();
    const stops = pageStops(), cur = -V.offY;
    const fxAnim = () => flipFx(delta) ? 'slow' : true;
    if (stops.length) {
      // Bläddringspunkter: nästa punkt hamnar i skärmens överkant
      if (delta > 0) { const t = stops.find(y => y > cur + 2); if (t != null) { goToStop(t, fxAnim()); return; } }
      else { const above = [0, ...stops].filter(y => y < cur - 2); if (above.length) { goToStop(above[above.length - 1], fxAnim()); return; } }
    } else {
      const { H } = stageSize(), stepY = Math.round(H * 0.9);
      if (delta > 0 && V.offY > V.minY + 2) { V.offY = clampY(V.offY - stepY); placeWrap(fxAnim()); return; }
      if (delta < 0 && V.offY < -2) { V.offY = clampY(V.offY + stepY); placeWrap(fxAnim()); return; }
    }
  }
  const before = [V.qi, V.page];
  if (delta > 0) {
    if (V.numPages && V.page < V.numPages) V.page++;
    else if (V.qi < V.queue.length - 1) { V.qi++; V.page = 1; }
    else { if (fromPan) { V.offY = clampY(V.offY); placeWrap(true); } toast(V.queue.length > 1 ? 'Slut på låtlistan' : 'Sista sidan'); return; }
  } else {
    if (V.page > 1) V.page--;
    else if (V.qi > 0) { V.qi--; V.page = -1; }
    else { if (fromPan) { V.offY = clampY(V.offY); placeWrap(true); } toast('Första sidan'); return; }
  }
  if (before[0] !== V.qi || before[1] !== V.page) { V.startAt = delta < 0 ? 'end' : 0; V.flipDir = delta; V.undo = []; V.redo = []; hideUndo(); showPage(); }
}

async function loadAnn(id){
  if (S.annLoaded.has(id)) return;
  S.annLoaded.add(id);
  const range = IDBKeyRange.bound(id + '_p', id + '_p￿');
  const [ks, vs] = await Promise.all([IDB.keys('ann', range), IDB.all('ann', range)]);
  let changed = false;
  ks.forEach((k, i) => { if (!S.ann.has(k) && vs[i]) { S.ann.set(k, vs[i]); changed = true; } });
  if (changed && V.open && V.queue[V.qi] === id) drawInk();
  if (MEMBER) return; // medlemsläget: anteckningarna kom med datan från hemsidan
  if (!S.db) { S.annLoaded.delete(id); return; }
  try {
    const snap = await withTimeout(S.db.collection('anteckningar').where('not', '==', id).get(), 12000);
    let ch = false;
    for (const d of snap.docs) {
      const k = d.id; if (!k.startsWith(id + '_p')) continue;
      if (S.pending.has('anteckningar/' + k) || annSaveT.has(k)) continue;
      const r = d.data() || {}; const l = S.ann.get(k);
      if (!l || (+r.uppdaterad || 0) > (+l.uppdaterad || 0)) {
        const e = { not: id, sida: +r.sida || +k.split('_p')[1] || 1, streck: cleanStrokes(r.streck), stopp: cleanStops(r.stopp), uppdaterad: +r.uppdaterad || 0 };
        S.ann.set(k, e); IDB.put('ann', k, e); ch = true;
      }
    }
    if (ch && V.open && V.queue[V.qi] === id) drawInk();
  } catch { S.annLoaded.delete(id); }
}

const annSaveT = new Map();
function saveAnn(k){
  const e = S.ann.get(k); if (!e) return;
  e.uppdaterad = Date.now();
  IDB.put('ann', k, e);
  clearTimeout(annSaveT.get(k));
  annSaveT.set(k, setTimeout(() => annCommit(k), 1200));
}
function annCommit(k){
  annSaveT.delete(k);
  const e = S.ann.get(k); if (!e) return;
  const body = { not: e.not, sida: e.sida, streck: e.streck, stopp: e.stopp || [], uppdaterad: e.uppdaterad };
  if (JSON.stringify(body).length > 250000) { toast(MEMBER ? 'Sidan har för många anteckningar – de sparas bara på den här enheten' : 'Sidan har för många anteckningar för molnet – de sparas bara här'); return; }
  queueWrite('anteckningar/' + k, body);
}
function pageEntry(create){
  const k = annKey();

function strokePath(ctx, p, w, h){
  ctx.beginPath();
  const X = i => p[i] / 1e4 * w, Y = i => p[i + 1] / 1e4 * h;
  ctx.moveTo(X(0), Y(0));
  if (p.length === 2) { ctx.lineTo(X(0) + 0.01, Y(0)); return; }
  for (let i = 2; i < p.length - 2; i += 2) {
    const mx = (X(i) + X(i + 2)) / 2, my = (Y(i) + Y(i + 2)) / 2;
    ctx.quadraticCurveTo(X(i), Y(i), mx, my);
  }
  ctx.lineTo(X(p.length - 2), Y(p.length - 2));
}
function drawStroke(ctx, st, w, h){
  ctx.save();
  ctx.lineCap = st.v === 'h' ? 'butt' : 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = st.f; ctx.lineWidth = st.b / 1e4 * w;
  ctx.globalAlpha = st.v === 'h' ? 0.38 : 1;
  strokePath(ctx, st.p, w, h); ctx.stroke();
  ctx.restore();
}
function drawInk(){
  const ctx = inkcv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, inkcv.width, inkcv.height);
  ctx.setTransform(V.inkDpr, 0, 0, V.inkDpr, 0, 0);
  const e = pageEntry(false); if (!e) return;
  const order = [...e.streck.filter(s => s.v === 'h'), ...e.streck.filter(s => s.v !== 'h')];
  for (const st of order) drawStroke(ctx, st, V.pageW, V.pageH);
  if (V.tool === 'stop') drawStops(ctx, e.stopp || []);
}
function drawStops(ctx, stops){
  ctx.save();
  stops.forEach((v, i) => {
    const y = Math.round(v / 1e4 * V.pageH) + 0.5;
    ctx.strokeStyle = '#8a3f1c'; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(V.pageW, y); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#8a3f1c';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(6, y - 13, 34, 26, 6) : ctx.rect(6, y - 13, 34, 26); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '600 14px -apple-system, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), 23, y + 1);
    // ✕ för att ta bort, längst till höger på linjen
    const cx = V.pageW - 24;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#8a3f1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, y, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

// Bläddringspunkter som scrollpositioner (px från sidans topp), justerade så att vyn inte går förbi nederkanten
function pageStops(){

  const max = V.pageH - 40;
  return [...new Set(e.stopp.map(v => Math.min(max, Math.round(v / 1e4 * V.pageH))))].sort((a, b) => a - b);
}
// Bläddringspunkter: tryck på tom yta = ny punkt, dra en linje = flytta, ✕ = ta bort
function stopHit(ev){
  const [, , px, py] = toPage(ev);

function stopStart(e){

function stopMove(e){

}
function stopEnd(e, s){
  const ent = pageEntry(true); ent.stopp = ent.stopp || [];
  if (s.mode === 'drag') {
    if (s.moved && s.cur !== s.from) { pushUndo({ k: s.k, stopMove: { from: s.from, to: s.cur } }); saveAnn(s.k); toast('Bläddringspunkten flyttad'); }
    else toast('Dra linjen för att flytta den, tryck på ✕ för att ta bort');

function clearLive(){ const c = livecv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, livecv.width, livecv.height); }
let liveRaf = 0;
function drawLive(extra){

    liveRaf = 0; clearLive();

    const st = V.stroke.st;

function toPage(e){

function pushUndo(a){ V.undo.push(a); if (V.undo.length > 100) V.undo.shift(); V.redo = []; flashUndo(); flashSwap(); }
// Växlingsknappen penna ⇄ sudd dyker upp först när man skriver eller suddar, och tonas bort efter en stund utan pennan
const SWAP_TOOLS = ['pen', 'hl', 'erase'], SWAP_MS = 10000;
let qSwapT = null;
function flashSwap(){

  if (!V.open || !SWAP_TOOLS.includes(V.tool)) { b.classList.remove('show'); return; }
  b.classList.add('show');

}
function hideSwap(){ clearTimeout(qSwapT); $('#qSwap').classList.remove('show'); }
// Snabbångra: en liten knapp uppe till höger som syns i 5 sekunder efter varje ändring
let qUndoT = null;
function flashUndo(){
  const b = $('#qUndo'); clearTimeout(qUndoT);
  if (!V.open || !V.undo.length) { b.classList.remove('show'); return; }

$('#qUndo').addEventListener('pointerdown', e => e.stopPropagation());

$('#qSwap').addEventListener('pointerdown', e => e.stopPropagation());
$('#qSwap').addEventListener('click', e => {

$('#qUndo').addEventListener('click', e => { e.stopPropagation(); undo(); });
function applyAction(a, inverse){
  const e = S.ann.get(a.k) || (() => { const n = { not: a.k.split('_p')[0], sida: +a.k.split('_p')[1], streck: [], stopp: [], uppdaterad: 0 }; S.ann.set(a.k, n); return n; })();
  if (a.stopMove) {
    const { from, to } = a.stopMove, [x, y] = inverse ? [to, from] : [from, to];
    e.stopp = (e.stopp || []).filter(v => v !== x); e.stopp.push(y); e.stopp.sort((p, q) => p - q);
    saveAnn(a.k); if (a.k === annKey()) drawInk(); return;
  }
  if (a.stopAdd != null || a.stopRemove != null) {
    const y = a.stopAdd != null ? a.stopAdd : a.stopRemove, add = (a.stopAdd != null) !== !!inverse;
    e.stopp = (e.stopp || []).filter(v => v !== y); if (add) e.stopp.push(y); e.stopp.sort((p, q) => p - q);
    saveAnn(a.k); if (a.k === annKey()) drawInk(); return;
  }
  const addMode = inverse ? !!a.remove : !!a.add;
  if (a.add) {
    if (addMode) e.streck.push(a.add); else e.streck = e.streck.filter(s => s !== a.add);
  } else if (a.remove) {
    if (addMode) { const sorted = [...a.remove].sort((x, y) => x.i - y.i); for (const { i, st } of sorted) e.streck.splice(Math.min(i, e.streck.length), 0, st); }
    else { const set = new Set(a.remove.map(r => r.st)); e.streck = e.streck.filter(s => !set.has(s)); }

}
function undo(){ const a = V.undo.pop(); if (!a) return; applyAction(a, true); V.redo.push(a); updateBar(); flashUndo(); }
function redo(){ const a = V.redo.pop(); if (!a) return; applyAction(a, false); V.undo.push(a); updateBar(); }

function eraseAt(e){
  const ent = pageEntry(false); if (!ent || !ent.streck.length) return;
  const [, , x, y] = toPage(e);

  const hits = [];
  ent.streck.forEach((st, i) => {
    const p = st.p, half = st.b / 1e4 * W / 2 + tol;
    for (let j = 0; j < p.length; j += 2) {
      const ax = p[j] / 1e4 * W, ay = p[j + 1] / 1e4 * H;
      const bx = j + 2 < p.length ? p[j + 2] / 1e4 * W : ax, by = j + 2 < p.length ? p[j + 3] / 1e4 * H : ay;
      const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
      const t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
      const qx = ax + t * dx - x, qy = ay + t * dy - y;
      if (qx * qx + qy * qy <= half * half) { hits.push(i); break; }
    }
  });
  if (!hits.length) return;
  const hitSet = new Set(hits);
  const removed = hits.map(i => ({ i, st: ent.streck[i] }));
  ent.streck = ent.streck.filter((_, i) => !hitSet.has(i));
  V.stroke.removed.push(...removed);

}

function startStroke(e){
  const k = annKey();

stage.addEventListener('pointerdown', e => {

stage.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });

/* ---------- Medlemsläget: bara det medlemmen ska kunna ---------- */
function setupMemberUi(){

  const back = document.createElement('button');
  back.className = 'btn'; back.id = 'backBtn'; back.textContent = '‹ Tillbaka'; back.title = 'Tillbaka till låtsidan';
  back.onclick = closeMember;
  $('header.top').insertBefore(back, $('header.top h1'));
  $('#search').placeholder = 'Sök titel eller kör';

/* ---------- Start ---------- */
(async function start(){
  if (MEMBER) setupMemberUi();
  const [n, l, settings, uq, pk, pv, pdfKeys, mp] = await Promise.all([
    IDB.get('kv', 'noter'), IDB.get('kv', 'listor'), IDB.get('kv', 'settings'), IDB.get('kv', 'uploadQueue'),
    IDB.keys('pending'), IDB.all('pending'), IDB.keys('pdf'), IDB.get('kv', 'mappar'),
  ]);
  S.noter = n || {}; S.listor = l || {}; S.mappar = mp || {};
  if (settings) Object.assign(S.settings, settings);
  if (S.settings.metro) Object.assign(M, S.settings.metro);
  // Medlemsläget: sidan skickar med vem som är inloggad (#m=…). Sparat från någon annan på enheten visas aldrig.
  const who = MEMBER ? new URLSearchParams(location.hash.slice(1)).get('m') || '' : '';
  if (MEMBER && (!who || !S.settings.medlemId || S.settings.medlemId !== who)) {
    if (S.settings.medlemId && S.settings.medlemId !== who) await wipeMemberCache();
    S.noter = {}; S.listor = {}; S.mappar = {};
    for (const k of ['noter', 'listor', 'mappar', 'pdfFil']) await IDB.del('kv', k);
    pk.length = 0; pv.length = 0; pdfKeys.length = 0;
    if (who) { S.settings.medlemId = who; IDB.put('kv', 'settings', S.settings); }
  }
  S.uploadQueue = Array.isArray(uq) ? uq : [];
  pk.forEach((k, i) => { if (pv[i]) S.pending.set(k, pv[i]); });
  overlayPending('noter', S.noter); overlayPending('listor', S.listor); overlayPending('mappar', S.mappar);
  pdfKeys.forEach(k => S.cached.add(k));
  render();
  try {
    if (navigator.storage && navigator.storage.persist) {
      S.persisted = await navigator.storage.persisted().catch(() => false) || await navigator.storage.persist().catch(() => false);
      renderStatus();
    }
  } catch {}
  if (LOCAL) { $('#fsBtn').hidden = true; setupServiceWorker(); }
  connect();
})();
