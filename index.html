<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Notstället</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notstället">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf9; --fg:#1f1c18; --muted:#6d675e; --line:#e3ddd1;
  --acc:#8a3f1c; --acc-soft:#f3e4d9; --ok:#2e7a4d; --warn:#a86400; --err:#b3261e;
  --stage:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:980px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:24px;margin:0;letter-spacing:-.01em;flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--err);border-color:#e9c6c2}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.status{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 14px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.status .ok .dot{background:var(--ok)} .status .warn .dot{background:var(--warn)} .status .err .dot{background:var(--err)}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font-size:14px;min-height:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px 16px;font-size:17px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--acc);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.field .chip,.field .search{color:var(--fg)}
.chip[aria-pressed=true]{background:var(--fg);color:#fff;border-color:var(--fg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 8px 4px 0}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 14px;min-height:56px}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:14px;color:var(--muted)}
.row .num{width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:6px}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--acc-soft);color:var(--acc);margin-left:6px;vertical-align:1px}
.badge.ok{background:#e1f0e6;color:var(--ok)} .badge.warn{background:#f8ead3;color:var(--warn)}
#selBar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#selCount{font-weight:600}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 26px;display:grid;place-items:center;font-size:15px;color:#fff;margin-left:14px}
.check.on{background:var(--acc);border-color:var(--acc)}
.check.ok{background:var(--ok);border-color:var(--ok)}
.btn.good{color:var(--ok);border-color:#bcdcc8}
.btn.good.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.annb{color:#2c5aa0;border-color:#c6d5ee}
.btn.annb.on{background:#2c5aa0;border-color:#2c5aa0;color:#fff}
.badge.ann{background:#e6eefb;color:#2c5aa0}
.row.done .t,.row.done .s{opacity:.55}
.secthead{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 14px 6px}
.row.sel{background:var(--acc-soft)}
.handle{width:44px;align-self:stretch;display:grid;place-items:center;color:var(--muted);font-size:24px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.row.dragging{position:relative;z-index:5;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:10px}
.row.shifting{transition:transform .15s ease}
.alpha{display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:26px;padding:4px 0;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;border-radius:13px}
.alpha span{font-size:12px;font-weight:600;line-height:1;color:var(--acc);padding:1px 0}
.alpha span.off{color:#c9c2b6}
.alpha.on{background:rgba(138,63,28,.08)}
.alpha.side{position:fixed;top:50%;transform:translateY(-50%);height:min(78vh,700px);z-index:20}
body.alpha-pad .app{padding-right:44px}
.pick{position:relative}
#pkAlpha{max-height:50vh;height:50vh}
#alphaBubble{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:20px;background:rgba(31,28,24,.8);color:#fff;font-size:52px;font-weight:700;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:60}
#alphaBubble.show{opacity:1}
.empty{padding:28px 20px;color:var(--muted);text-align:center}
.detailhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;min-height:44px;color:var(--fg);font-size:16px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:12px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:40px;height:40px;display:inline-grid;place-items:center;padding:0}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,18,16,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 12px;font-size:20px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal p{margin:0 0 10px}
.prog{font-size:14px;margin:10px 0 0;padding:0;list-style:none}
.prog li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.prog li span:last-child{color:var(--muted);white-space:nowrap}
.pickrow{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:0;cursor:pointer;min-height:60px}
.pickrow{display:flex;align-items:center}
.pickrow .main{display:block;flex:1;padding:10px 14px}
.pickrow .plus{padding:0 16px;color:var(--acc);font-size:24px}
.pickrow:active,.pickrow.added{background:var(--acc-soft)}
.pick{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
/* Viewer */
#viewer{position:fixed;inset:0;background:var(--stage);z-index:40;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:absolute;inset:0;touch-action:none;overflow:hidden}
#pagewrap{position:absolute;left:0;top:0;background:#fff;box-shadow:0 0 0 1px #d6d1c8;will-change:transform}
#pagewrap.anim{transition:transform .18s ease-out}
#pagewrap.anim2{transition:transform .34s cubic-bezier(.2,.75,.25,1)}
#vflash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3}
#pagewrap{transform-origin:0 0}
#metro{position:absolute;left:12px;bottom:12px;z-index:7;background:rgba(250,248,244,.98);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:min(560px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px}
#metro .mrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#metro .mlab{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
#metro select{font-size:16px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 6px}
#mBpm{width:76px;min-height:44px;font-size:22px;font-weight:600;text-align:center;border:1px solid var(--line);border-radius:9px;background:#fff}
#mSlider{width:100%;accent-color:var(--acc)}
#mPlay{min-width:96px}
#mPlay.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#metroDot{position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:50%;background:#e6e1d8;z-index:6;pointer-events:none;box-shadow:0 0 0 2px #fff}
#metroDot.hit{background:#1f1c18;transition:none}
#metroDot.hit.acc{background:#c62828}
#metroDot.fade{transition:background .22s ease-out}
#vMetro.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#zoomPill{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(250,248,244,.97);border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:6;white-space:nowrap}
#zoomPill .btn{min-height:38px;padding:6px 12px;font-size:15px}
#vscroll{position:absolute;right:4px;top:12%;bottom:12%;width:5px;border-radius:3px;background:rgba(0,0,0,.08);pointer-events:none}
#vscroll i{position:absolute;left:0;right:0;border-radius:3px;background:rgba(0,0,0,.35);transition:top .18s ease-out}
#pageslot canvas{display:block}
#inkcv,#livecv{position:absolute;left:0;top:0;pointer-events:none}
#vmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);text-align:center;padding:24px;max-width:420px}
#vbar{position:absolute;left:0;right:0;top:0;background:rgba(250,248,244,.97);border-bottom:1px solid var(--line);
  padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#vbar .grp{display:flex;gap:4px;align-items:center}
#vbar .title{flex:1;min-width:140px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#vbar .title small{font-weight:400;color:var(--muted);margin-left:6px}
.tb{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:44px;height:44px;display:inline-grid;place-items:center;padding:0 8px;font-size:15px}
.tb[aria-pressed=true]{background:var(--fg);color:#fff;border-color:var(--fg)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--acc)}
#vTools{min-width:172px;justify-content:start;display:inline-flex;gap:7px;padding:0 10px}
#vTools .car{margin-left:auto;font-size:12px;opacity:.7}
#vTools .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px #fff}
#vTools[aria-expanded=true]{box-shadow:0 0 0 3px var(--acc-soft)}
#toolPop{position:absolute;z-index:9;width:250px;background:rgba(250,248,244,.99);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:4px}
#toolPop[hidden]{display:none}
.tpi{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:0;border-radius:10px;background:none;padding:0 12px;font-size:16px;text-align:left;cursor:pointer}
.tpi .ic{width:22px;text-align:center}
.tpi[aria-pressed=true]{background:var(--fg);color:#fff}
.tpsec{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0;padding:10px 4px;display:flex;flex-direction:column;gap:10px;transition:opacity .15s}
.tpsec.off{opacity:.3;pointer-events:none}
.tprow{display:flex;gap:12px;justify-content:space-around}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;background:#fff;font-size:15px}
.seg button[aria-pressed=true]{background:var(--fg);color:#fff}
#qUndo{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);width:56px;height:56px;border-radius:50%;border:0;
  background:rgba(31,28,24,.82);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:5;touch-action:manipulation}
#qUndo.show{opacity:1;pointer-events:auto}
#qSwap{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);width:56px;height:56px;border-radius:50%;border:0;
  background:rgba(31,28,24,.72);color:#fff;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5;touch-action:manipulation;
  opacity:0;pointer-events:none;transition:opacity .25s}
#qSwap.show{opacity:1;pointer-events:auto}
#qSwap.erase{background:var(--acc)}
#vtoast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:7px 16px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s}
#vtoast.show{opacity:1}
#vlist{position:absolute;z-index:9;width:min(360px,90vw);max-height:70vh;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:auto;padding:12px}
#vlist h3{margin:4px 6px 10px}
#vlist button.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 8px;min-height:48px}
#vlist button.item[aria-current=true]{background:var(--acc-soft);font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Notstället</h1>
    <button class="btn" id="fsBtn" title="Helskärm">⤢ Helskärm</button>
    <button class="btn primary" id="addBtn">＋ Lägg till noter</button>
    <input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>
    <input type="file" id="bkFile" hidden>
  </header>
  <div class="status" id="status"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabNoter" aria-selected="true">Noter</button>
    <button role="tab" id="tabListor" aria-selected="false">Låtlistor</button>
    <button role="tab" id="tabVer" aria-selected="false">Versioner</button>
  </nav>

  <section id="pNoter">
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Sök titel, kör eller filnamn" autocomplete="off">
      <button class="btn" id="selBtn">Välj flera</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="noterList"></div>
  </section>

  <section id="pVer" hidden>
    <div id="verIndex">
      <p style="color:var(--muted);margin:0 0 10px;font-size:15px">Noter med samma titel där bara siffrorna eller datumet på slutet skiljer sig. Välj en titel för att se versionerna och ta bort gamla.</p>
      <div class="tools"><input class="search" id="verSearch" type="search" placeholder="Sök titel" autocomplete="off"></div>
      <div class="list" id="verList"></div>
    </div>
    <div id="verDetail" hidden></div>
  </section>

  <section id="pListor" hidden>
    <div id="listorIndex">
      <div id="folderHead"></div>
      <div class="tools"><button class="btn primary" id="newListBtn">＋ Ny låtlista</button><button class="btn" id="newFolderBtn">＋ Ny mapp</button><button class="btn" id="korFoldersBtn" hidden>Skapa en mapp per kör</button></div>
      <div class="list" id="listorList"></div>
    </div>
    <div id="listDetail" hidden></div>
  </section>
</div>

<div id="viewer" hidden>
  <div id="stage">
    <div id="pagewrap" hidden>
      <div id="pageslot"></div>
      <canvas id="inkcv"></canvas>
      <canvas id="livecv"></canvas>
    </div>
    <div id="vmsg" hidden></div>
    <div id="vscroll" hidden><i></i></div>
    <div id="vflash"></div>
  </div>
  <div id="vbar" hidden>
    <div class="grp">
      <button class="tb" id="vClose" title="Stäng">‹ Stäng</button>
      <button class="tb" id="vListBtn" title="Låtlistan">☰ Lista</button>
    </div>
    <div class="title" id="vTitle" title="Tryck för att byta namn"></div>
    <div class="grp">
      <button class="tb" id="vPrev" title="Föregående sida">◀</button>
      <span id="vPage" style="min-width:64px;text-align:center;font-variant-numeric:tabular-nums"></span>
      <button class="tb" id="vNext" title="Nästa sida">▶</button>
    </div>
    <div class="grp">
      <button class="tb" id="vTools" aria-expanded="false" aria-haspopup="true" title="Ritverktyg"></button>
      <button class="tb" id="vUndo" title="Ångra">↶</button>
      <button class="tb" id="vRedo" title="Gör om">↷</button>
    </div>
    <div class="grp">
      <button class="tb" id="vMetro" title="Metronom">♩ Metronom</button>
      <button class="tb" id="vMore" title="Mer">⋯</button>
    </div>
  </div>
  <div id="toolPop" hidden>
    <div id="toolGrp">
      <button class="tpi" data-tool="pen"><span class="ic">✎</span>Penna</button>
      <button class="tpi" data-tool="hl"><span class="ic">▍</span>Markera</button>
      <button class="tpi" data-tool="erase"><span class="ic">⌫</span>Sudd</button>
      <button class="tpi" data-tool="stop"><span class="ic">⤓</span>Bläddringspunkt</button>
    </div>
    <div class="tpsec" id="tpStyle">
      <div class="tprow" id="colorGrp"></div>
      <div class="seg" id="vWidth"><button data-w="fin">Fin</button><button data-w="grov">Grov</button></div>
    </div>
    <button class="tpi" id="vFinger"><span class="ic">☝︎</span>Fingret ritar också</button>
  </div>
  <button id="qUndo" title="Ångra" aria-label="Ångra">↶</button>
  <button id="qSwap" title="Växla mellan penna och sudd" aria-label="Växla mellan penna och sudd"></button>
  <div id="metroDot" hidden></div>
  <div id="metro" hidden>
    <div class="mrow">
      <button class="tb" id="mPlay">▶ Start</button>
      <button class="tb" id="mMinus" title="Långsammare">−</button>
      <input id="mBpm" type="number" min="20" max="300" inputmode="numeric" aria-label="Tempo">
      <span class="mlab">BPM</span>
      <button class="tb" id="mPlus" title="Snabbare">+</button>
      <button class="tb" id="mTap" title="Trumma takten">Tap</button>
      <span style="flex:1"></span>
      <button class="tb" id="mClose" title="Dölj panelen (metronomen fortsätter)">✕</button>
    </div>
    <input type="range" id="mSlider" min="20" max="300" step="1" aria-label="Tempo">
    <div class="mrow">
      <label class="mlab">Slag/takt <select id="mBeats"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
      <button class="tb" id="mSound">🔊 Klick</button>
      <button class="tb" id="mBlink">● Blink</button>
      <button class="tb" id="mSaveTempo">Spara tempo för noten</button>
    </div>
  </div>
  <div id="zoomPill" hidden><span id="zoomTxt"></span><button class="btn primary" id="zoomSave">Spara för den här noten</button><button class="btn" id="zoomReset">Återställ</button></div>
  <div id="vtoast"></div>
  <div id="vlist" hidden></div>
</div>

<div id="selBar" hidden>
  <span id="selCount"></span>
  <button class="btn small" id="selAll">Markera alla som visas</button>
  <span style="flex:1"></span>
  <button class="btn" id="selCancel">Avbryt</button>
  <button class="btn" id="selShare">⇪ Dela pdf</button>
  <button class="btn primary" id="selAdd">Lägg till i kör / låtlista…</button>
</div>

<script type="module">
import * as pdfjsLib from './pdf.min.mjs';

const LOCAL = APP_MODE === 'pwa';

const MEMBER = APP_MODE === 'wix';
// Zoom (nyp med två fingrar + sparad zoom per not). Avstängd tills vidare (28 nov 2026, Hugo) – sätt true för att slå på igen.

const ZOOM_ON = false;

const BASE = document.baseURI;

const PDF_OPTS = {

const KORER = ['Bagiskören','Zinkens indiekör','Sibiriens popkör','Järfälla manskör','Mosebacke vokalensemble','Husbandet','Övrigt'];
const COLORS = [['#1f1c18','Svart'],['#c62828','Röd'],['#1e5bb8','Blå'],['#2e7d32','Grön']];
const HL_COLORS = [['#ffd600','Gul'],['#7bdcff','Ljusblå'],['#ff9ecb','Rosa'],['#b6f27a','Grön']];

const $ = s => document.querySelector(s);

const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]);

const fmtMB = b => b ? (b/1048576).toFixed(b < 1048576*10 ? 1 : 0).replace('.', ',') + ' MB' : '';

/* ---------- Lokal lagring (IndexedDB) ---------- */
const IDB = (() => {
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open(MEMBER ? 'notstallet-medlem' : 'notstallet', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { const d = r.result; for (const s of ['pdf','kv','ann','pending']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    dbp.catch(() => {});
    return dbp;
  }
  async function tx(store, mode, fn){
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get: (st, k) => tx(st, 'readonly', s => s.get(k)).catch(() => undefined),
    put: (st, k, v) => tx(st, 'readwrite', s => s.put(v, k)).then(() => true).catch(e => { console.warn('IDB put', e); return false; }),
    del: (st, k) => tx(st, 'readwrite', s => s.delete(k)).catch(() => {}),
    keys: (st, range) => tx(st, 'readonly', s => s.getAllKeys(range)).catch(() => []),
    all: (st, range) => tx(st, 'readonly', s => s.getAll(range)).catch(() => []),

})();

/* ---------- Tillstånd ---------- */
const S = {
  noter: {}, listor: {}, mappar: {}, openFolder: null, ann: new Map(), annLoaded: new Set(),
  pending: new Map(), uploadQueue: [], cached: new Set(),
  db: null, assets: null, dbStatus: 'laddar', synced: {},
  flushing: false, flushAgain: false, retryTimer: null, lastError: '',

  settings: { pencilDraws: true, fillWidth: true },
  selMode: false, sel: [],
};

/* ---------- Synk: allt skrivs lokalt först, sedan till molnet ---------- */
let seqC = 0;
function queueWrite(path, data){
  if (LOCAL) return; // hemskärmsappen: allt ligger redan i IndexedDB, inget moln att synka mot
  const item = { path, data, seq: Date.now() + ':' + (++seqC) };
  S.pending.set(path, item);
  IDB.put('pending', path, item);
  if (S.flushing) S.flushAgain = true;
  renderStatus();
  flushSoon();
}
let flushT = null;
function flushSoon(ms = 400){ clearTimeout(flushT); flushT = setTimeout(flush, ms); }
function retryLater(){ if (!S.retryTimer) S.retryTimer = setTimeout(() => { S.retryTimer = null; flush(); }, 15000); }

async function flush(){
  if (S.flushing || !S.db) return;
  S.flushing = true; S.flushAgain = false;
  let failed = false;
  try {
    for (const [path, item] of [...S.pending]) {
      const ref = S.db.doc(path);
      try {
        await withTimeout(item.data === null ? ref.delete() : ref.set(item.data), 20000);
        if (S.pending.get(path) === item) { S.pending.delete(path); IDB.del('pending', path); }
        S.lastError = '';
      } catch (e) {
        const code = e && e.code;
        if (code === 'invalid_argument' || code === 'quota_exceeded') {
          if (S.pending.get(path) === item) { S.pending.delete(path); IDB.del('pending', path); }
          S.lastError = MEMBER ? (e.message || 'En ändring kunde inte sparas på hemsidan.')
            : code === 'quota_exceeded' ? 'Molnlagringen är full – en ändring kunde inte sparas där.' : 'En ändring kunde inte sparas i molnet (för stor?).';
        } else { failed = true; break; }
      }
    }
    if (!failed) failed = !(await uploadPending());
  } finally {
    S.flushing = false;
    renderStatus();
    if (failed) retryLater();
    else if (S.flushAgain) flushSoon(100);
  }
}
window.addEventListener('online', () => flushSoon(500));

async function uploadPending(){
  if (!S.uploadQueue.length) return true;
  if (!S.assets) return true;
  for (const id of [...S.uploadQueue]) {
    const n = S.noter[id];
    if (!n || n.asset) { removeFromUploadQueue(id); continue; }
    const buf = await IDB.get('pdf', id);
    if (!buf) { removeFromUploadQueue(id); continue; }
    try {
      const r = await withTimeout(S.assets.upload(new Blob([buf], {type:'application/pdf'}), {type:'application/pdf'}), 180000);
      const m = S.noter[id]; if (m) { m.asset = r.id; writeNot(id); } removeFromUploadQueue(id);
    } catch (e) {
      if (e && (e.code === 'too_large' || e.code === 'unsupported_type' || e.code === 'invalid_request')) { n.molnfel = true; removeFromUploadQueue(id); continue; }
      return false;
    }
  }
  return true;
}
function removeFromUploadQueue(id){ S.uploadQueue = S.uploadQueue.filter(x => x !== id); IDB.put('kv', 'uploadQueue', S.uploadQueue); }

function strip(o){ const { id, molnfel, ...rest } = o; return JSON.parse(JSON.stringify(rest)); } // tar bort odefinierade fält
function writeNot(id){ const n = S.noter[id]; if (!n) return; n.uppdaterad = Date.now(); IDB.put('kv','noter',S.noter); queueWrite('noter/' + id, strip(n)); }
function writeMapp(id){ const m = S.mappar[id]; if (!m) return; m.uppdaterad = Date.now(); IDB.put('kv','mappar',S.mappar); queueWrite('mappar/' + id, strip(m)); }
function writeList(id){ const l = S.listor[id]; if (!l) return; l.uppdaterad = Date.now(); IDB.put('kv','listor',S.listor); queueWrite('listor/' + id, strip(l)); if (V.open && V.listId === id) refreshViewerQueue(); }

function overlayPending(coll, obj){
  for (const [path, item] of S.pending) {
    const i = path.indexOf('/'); if (path.slice(0, i) !== coll) continue;
    const id = path.slice(i + 1);
    if (item.data === null) delete obj[id]; else obj[id] = { ...item.data, id };
  }
  return obj;
}

function cleanNot(id, d){
  return { id, titel: String(d.titel || 'Utan titel').slice(0, 200), korer: Array.isArray(d.korer) ? [...new Set(d.korer.filter(k => typeof k === 'string' && k.trim()).map(k => k.trim().slice(0, 60)))].slice(0, 20) : (d.kor ? [String(d.kor)] : []), filnamn: String(d.filnamn || ''),
    storlek: +d.storlek || 0, sidor: +d.sidor || 0, asset: typeof d.asset === 'string' && /^[A-Za-z0-9_-]{8,64}$/.test(d.asset) ? d.asset : null,
    sha: typeof d.sha === 'string' && /^[0-9a-f]{64}$/.test(d.sha) ? d.sha : '',
    verOk: d.verOk ? 1 : undefined, // kontrollerad i fliken Versioner – alla versioner ska finnas kvar
    medNot: d.medNot ? 1 : undefined, // pdf:en har inbrända anteckningar (t.ex. export från forScore)
    zoom: cleanZoom(d.zoom),
    tempo: +d.tempo >= 20 && +d.tempo <= 300 ? Math.round(+d.tempo) : undefined,
    tempoKoll: d.tempoKoll === true ? 1 : (+d.tempoKoll > 0 ? +d.tempoKoll : undefined), // version av avläsningen som har körts
    tempoSrc: d.tempoSrc === 'not' ? 'not' : undefined,
    skapad: +d.skapad || 0, uppdaterad: +d.uppdaterad || 0 };
}
function cleanZoom(z){
  if (!z || typeof z !== 'object') return undefined;
  const out = {};
  for (const k of ['sta', 'ligg']) { const v = z[k]; if (v && +v.z >= 0.5 && +v.z <= 4 && Math.abs(+v.z - 1) > 0.01) out[k] = { z: +v.z, x: Math.min(1, Math.max(0, +v.x || 0)) }; }
  return Object.keys(out).length ? out : undefined;
}
function cleanMapp(id, d){ return { id, namn: String(d.namn || 'Mapp').slice(0, 100), skapad: +d.skapad || 0, uppdaterad: +d.uppdaterad || 0 }; }
function cleanList(id, d){
  return { id, namn: String(d.namn || 'Låtlista').slice(0, 200), datum: /^\d{4}-\d{2}-\d{2}$/.test(d.datum || '') ? d.datum : '', mapp: typeof d.mapp === 'string' ? d.mapp.slice(0, 64) : '',
    verk: Array.isArray(d.verk) ? d.verk.filter(x => typeof x === 'string').slice(0, 300) : [], skapad: +d.skapad || 0, uppdaterad: +d.uppdaterad || 0 };
}
function cleanStops(arr){
  return Array.isArray(arr) ? [...new Set(arr.filter(n => typeof n === 'number' && n > 0 && n < 1e4).map(Math.round))].sort((a, b) => a - b).slice(0, 50) : [];
}
function cleanStrokes(arr){
  if (!Array.isArray(arr)) return [];
  const out = [];
  for (const s of arr) {
    if (!s || !Array.isArray(s.p)) continue;
    const p = s.p.filter(n => typeof n === 'number' && isFinite(n));
    if (p.length < 2) continue;
    out.push({ v: s.v === 'h' ? 'h' : 'p', f: /^#[0-9a-f]{6}$/i.test(s.f) ? s.f : '#1f1c18', b: Math.min(600, Math.max(5, +s.b || 22)), p });
  }
  return out;
}

/* ---------- Medlemsläget: allt går via sidan på hemsidan som bäddar in appen ---------- */
// Sidan (portalens app på hemsidan) svarar på:
//   klar          → data { medlem, kor, noter[], listor[], mappar[], anteckningar{}, start }
//   pdf { not }   → svar med pdf-filen (ArrayBuffer). Sidan hämtar den själv från hemsidan, så inga CORS-regler behövs.
//   spara { andring } → svar ok / fel. andring = { typ:'sida', not, sida, streck, stopp, uppdaterad } | { typ:'not', not, zoom, tempo }
//   stang         → sidan stänger helskärmsrutan
// Meddelanden godtas bara från fönstret som bäddar in appen, och bara från hemsidans domäner.
const SITE_ORIGIN = /^https:\/\/(?:[a-z0-9-]+\.)*(?:enstoringproduktion\.se|wixsite\.com|wixstudio\.io|wixstudio\.com)$/;
const W = { origin: null, seq: 0, wait: new Map(), medlem: null, kor: '', pdf: {}, sent: {}, got: false, ready: null, readyRes: null, timer: null };
W.ready = new Promise(r => { W.readyRes = r; });
function wPost(msg, transfer){
  if (!MEMBER || window.parent === window) return;
  try { window.parent.postMessage({ ns: 'notstallet', ...msg }, W.origin || '*', transfer || []); } catch {}
}
function wAsk(typ, data, ms = 30000){
  return W.ready.then(() => new Promise((res, rej) => {
    const id = ++W.seq;
    const t = setTimeout(() => { W.wait.delete(id); rej({ code: 'timeout', message: 'Hemsidan svarade inte.' }); }, ms);
    W.wait.set(id, { res, rej, t });
    wPost({ typ, id, ...data });
  }));
}
window.addEventListener('message', e => {
  if (!MEMBER || e.source !== window.parent || !SITE_ORIGIN.test(e.origin)) return;
  const m = e.data; if (!m || m.ns !== 'notstallet') return;
  W.origin = e.origin; W.readyRes();
  if (m.typ === 'data') { wData(m.data || {}); return; }
  if (m.typ === 'data-fel') { clearTimeout(W.timer); S.dbStatus = 'fel'; S.lastError = String(m.fel || 'Hemsidan kunde inte skicka noterna.'); renderStatus(); return; }
  if (m.typ === 'svar') {
    const w = W.wait.get(m.id); if (!w) return;
    W.wait.delete(m.id); clearTimeout(w.t);
    if (m.ok) w.res(m.data); else w.rej({ code: m.kod || 'fel', message: String(m.fel || 'Något gick fel.') });
  }
});
// Skrivningar i medlemsläget: bara egna anteckningar, bläddringspunkter, zoom och tempo. Allt annat ändras inte här.
function memberDb(){
  const save = async (path, data) => {
    const i = path.indexOf('/'), coll = path.slice(0, i), key = path.slice(i + 1);
    if (coll === 'anteckningar') {
      const [not, sida] = [key.split('_p')[0], +key.split('_p')[1]];
      const a = data || {};
      return wAsk('spara', { andring: { typ: 'sida', not, sida, streck: data ? a.streck || [] : [], stopp: data ? a.stopp || [] : [], uppdaterad: +a.uppdaterad || Date.now() } });
    }
    if (coll === 'noter' && data) {
      const set = { zoom: data.zoom || null, tempo: data.tempo && data.tempoSrc !== 'not' ? data.tempo : null };
      const sig = JSON.stringify(set);
      if (W.sent[key] === sig) return; // inget som sparas på hemsidan har ändrats (t.ex. bara sidantalet)
      await wAsk('spara', { andring: { typ: 'not', not: key, ...set } });
      W.sent[key] = sig;
    }
  };
  return { doc: path => ({ set: data => save(path, data), delete: () => save(path, null) }) };
}
async function wipeMemberCache(){
  for (const st of ['pdf', 'ann', 'pending']) for (const k of await IDB.keys(st)) await IDB.del(st, k);
  S.ann.clear(); S.annLoaded.clear(); S.pending.clear(); S.cached.clear();
  for (const id of [...docCache.keys()]) forgetDoc(id);
}
async function wData(d){
  clearTimeout(W.timer);
  const me = String(d.medlem && d.medlem.id || '');
  // Någon annan har loggat in på samma enhet: ingenting från förra medlemmen får synas
  if (me && S.settings.medlemId && S.settings.medlemId !== me) await wipeMemberCache();
  S.settings.medlemId = me; IDB.put('kv', 'settings', S.settings);
  W.medlem = d.medlem || null; W.kor = String(d.kor || '');
  const filer = (await IDB.get('kv', 'pdfFil')) || {};
  const noter = {}, nyFil = {};
  for (const x of Array.isArray(d.noter) ? d.noter : []) {
    if (!x || typeof x.id !== 'string') continue;
    const n = cleanNot(x.id, { titel: x.titel, korer: x.korer, filnamn: x.filnamn, sidor: x.sidor, zoom: x.zoom, tempo: x.tempo, uppdaterad: x.uppdaterad, skapad: x.uppdaterad });
    const old = S.noter[x.id];
    if (old && old.tempoSrc === 'not' && !n.tempo) { n.tempo = old.tempo; n.tempoSrc = 'not'; } // tempo som lästs av från noten på enheten
    if (old && old.sidor && !n.sidor) n.sidor = old.sidor;
    if (old && old.tempoKoll) n.tempoKoll = old.tempoKoll;
    noter[x.id] = n;
    W.pdf[x.id] = { fil: String(x.fil || '') };
    nyFil[x.id] = String(x.fil || '');
    W.sent[x.id] = JSON.stringify({ zoom: n.zoom || null, tempo: x.tempo ? n.tempo || null : null });
    // Ny pdf för låten på hemsidan: glöm den gamla filen och anteckningarna som hörde till den
    if (filer[x.id] && filer[x.id] !== nyFil[x.id]) {
      forgetDoc(x.id); IDB.del('pdf', x.id); S.cached.delete(x.id);
      for (const k of await IDB.keys('ann', IDBKeyRange.bound(x.id + '_p', x.id + '_p￿'))) { IDB.del('ann', k); S.ann.delete(k); }
    }
  }
  for (const id of Object.keys(filer)) if (!noter[id]) { IDB.del('pdf', id); S.cached.delete(id); } // noter som inte längre visas för medlemmen
  IDB.put('kv', 'pdfFil', nyFil);
  S.noter = noter;
  S.listor = {}; for (const l of Array.isArray(d.listor) ? d.listor : []) if (l && typeof l.id === 'string') S.listor[l.id] = cleanList(l.id, l);
  S.mappar = {}; for (const m of Array.isArray(d.mappar) ? d.mappar : []) if (m && typeof m.id === 'string') S.mappar[m.id] = cleanMapp(m.id, m);
  IDB.put('kv', 'noter', S.noter); IDB.put('kv', 'listor', S.listor); IDB.put('kv', 'mappar', S.mappar);
  // Anteckningarna: hemsidans version gäller, utom på sidor med ändringar som inte hunnit sparas
  const server = d.anteckningar && typeof d.anteckningar === 'object' ? d.anteckningar : {};
  const busy = k => S.pending.has('anteckningar/' + k) || annSaveT.has(k);
  for (const k of await IDB.keys('ann')) if (!server[k] && !busy(k)) { IDB.del('ann', k); S.ann.delete(k); }
  for (const [k, a] of Object.entries(server)) {
    const nid = k.split('_p')[0]; if (!noter[nid] || busy(k)) continue;
    const e = { not: nid, sida: +a.sida || +k.split('_p')[1] || 1, streck: cleanStrokes(a.streck), stopp: cleanStops(a.stopp), uppdaterad: +a.uppdaterad || 0 };
    S.ann.set(k, e); IDB.put('ann', k, e);
  }
  for (const id of Object.keys(noter)) S.annLoaded.add(id);
  const first = !W.got; W.got = true;
  if (first && W.kor && allKorer().length > 1 && allKorer().includes(W.kor)) S.korFilter = W.kor;
  S.dbStatus = 'online'; S.lastError = '';
  render();
  if (V.open) { if (!V.queue.every(id => S.noter[id])) closeViewer(); else { updateBar(); drawInk(); } }
  if (first && d.start && S.noter[d.start] && !V.open) openViewer([d.start], 0, 1, null);
  flushSoon(300);
}
function connectMember(){
  S.db = memberDb();
  S.dbStatus = 'laddar'; renderStatus();
  const hello = () => wPost({ typ: 'klar', version: APP_VERSION });
  hello();
  // Inget svar: visa det som finns sparat på enheten och fråga igen en gång
  W.timer = setTimeout(() => { if (!W.got) { S.dbStatus = 'offline'; renderStatus(); hello(); W.timer = setTimeout(() => { if (!W.got) { S.dbStatus = 'offline'; renderStatus(); } }, 20000); } }, 15000);
}
// Spara det som väntar innan rutan stängs eller sidan göms
function commitAnnNow(){ for (const k of [...annSaveT.keys()]) { clearTimeout(annSaveT.get(k)); annCommit(k); } }
async function closeMember(){
  commitAnnNow(); flushSoon(0);
  const waiting = () => S.pending.size > 0;
  if (waiting()) {
    openModal(`<h2>Sparar dina anteckningar…</h2><p id="cmTxt">Ett ögonblick.</p>`);
    for (let i = 0; i < 40 && waiting(); i++) await sleep(250);
    if (waiting()) {
      openModal(`<h2>Allt är inte sparat än</h2><p>${S.pending.size === 1 ? 'En ändring' : S.pending.size + ' ändringar'} har inte kommit fram till hemsidan. De ligger kvar på den här enheten och skickas nästa gång du öppnar Notstället.</p>
        <div class="actions"><button class="btn" id="cmWait">Vänta</button><button class="btn primary" id="cmClose">Stäng ändå</button></div>`);
      $('#cmWait').onclick = () => { closeModal(); flushSoon(0); };
      $('#cmClose').onclick = () => { closeModal(); wPost({ typ: 'stang' }); };
      return;
    }
    closeModal();
  }
  if (V.open) closeViewer();
  wPost({ typ: 'stang' });
}
if (MEMBER) document.addEventListener('visibilitychange', () => { if (document.hidden) { commitAnnNow(); flushSoon(0); } });

async function connect(){
  if (MEMBER) { connectMember(); return; }
  if (LOCAL) { S.dbStatus = 'lokal'; renderStatus(); return; }
  for (let i = 0; i < 50 && !(window.claude && window.claude.use); i++) await sleep(100);
  if (!(window.claude && window.claude.use)) { S.dbStatus = 'lokal'; renderStatus(); return; }
  const timer = setTimeout(() => { if (S.dbStatus === 'laddar') { S.dbStatus = 'offline'; renderStatus(); } }, 10000);
  let db = null;
  try { db = await window.claude.use('db'); } catch {}
  try { S.assets = await window.claude.use('assets'); } catch { S.assets = null; }
  if (!db) { clearTimeout(timer); S.dbStatus = 'lokal'; render(); return; }
  S.db = db;
  const sub = (coll, key, clean) => {
    try {
      db.collection(coll).onSnapshot(snap => {
        const obj = {};
        for (const d of snap.docs) obj[d.id] = clean(d.id, d.data() || {});
        S[key] = overlayPending(coll, obj);
        IDB.put('kv', key, S[key]);
        if (!snap.metadata.fromCache) {
          S.synced[key] = true;
          if (S.synced.noter && S.synced.listor && S.synced.mappar) { clearTimeout(timer); S.dbStatus = 'online'; }
        }
        render();
        if (V.open) updateBar();
      }, err => { clearTimeout(timer); S.dbStatus = (err && err.code === 'revoked') ? 'lokal' : 'fel'; renderStatus(); });
    } catch (e) { S.dbStatus = 'fel'; renderStatus(); }
  };
  sub('noter', 'noter', cleanNot);
  sub('listor', 'listor', cleanList);
  sub('mappar', 'mappar', cleanMapp);
  flushSoon(1500);
}

/* ---------- PDF-hantering ---------- */
async function getPdfBytes(id){
  let buf = await IDB.get('pdf', id);
  if (buf) { S.cached.add(id); return buf; }
  const n = S.noter[id];
  if (MEMBER) {
    // Sidan på hemsidan hämtar pdf:en (samma domän som filen) och skickar den hit
    if (!n || !W.pdf[id]) throw new Error('Noten finns inte på hemsidan längre.');
    try { buf = await wAsk('pdf', { not: id }, 90000); }
    catch (e) { throw new Error(e && e.code === 'timeout' ? 'Kunde inte hämta noten – ingen internetanslutning?' : (e && e.message) || 'Kunde inte hämta noten.'); }
    if (!(buf instanceof ArrayBuffer) || !buf.byteLength) throw new Error('Kunde inte hämta noten.');
    if (await IDB.put('pdf', id, buf)) S.cached.add(id);
    return buf;
  }
  if (!n || !n.asset) throw new Error('Filen finns inte på den här enheten och har inte laddats upp till molnet än.');
  let r;
  try { r = await withTimeout(fetch('/_blob/' + n.asset), 60000); } catch { throw new Error('Kunde inte hämta noten – ingen internetanslutning?'); }
  if (!r.ok) throw new Error('Kunde inte hämta noten (' + r.status + ').');
  buf = await r.arrayBuffer();
  if (await IDB.put('pdf', id, buf)) S.cached.add(id);
  return buf;
}
const docCache = new Map(); // id -> Promise<PDFDocumentProxy>
const docTasks = new WeakMap();
const destroyDoc = d => { try { const t = docTasks.get(d); if (t) t.destroy(); } catch {} };
function getDoc(id){
  if (docCache.has(id)) { const p = docCache.get(id); docCache.delete(id); docCache.set(id, p); return p; }
  const p = (async () => {
    const buf = await getPdfBytes(id);
    const task = pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), ...PDF_OPTS });
    const d = await task.promise; docTasks.set(d, task); return d;
  })();
  p.catch(() => docCache.delete(id));
  docCache.set(id, p);
  while (docCache.size > 4) {
    const [k, old] = docCache.entries().next().value;
    if (V.open && V.queue.includes(k) && Math.abs(V.queue.indexOf(k) - V.qi) <= 1) { docCache.delete(k); docCache.set(k, old); break; }
    docCache.delete(k); old.then(destroyDoc).catch(() => {});
  }
  return p;
}
function forgetDoc(id){ const p = docCache.get(id); if (p) { docCache.delete(id); p.then(destroyDoc).catch(() => {}); } }

function titleFromName(name){

/* ---------- Bokstavsrad (#, A–Ö) för att hoppa i listor ---------- */
const ALPHA = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'Å', 'Ä', 'Ö'];
function firstLetter(t){
  const c = (String(t || '').trim()[0] || '').toUpperCase();
  if (c && 'ÅÄÖ'.includes(c)) return c;
  if (c === 'Æ') return 'Ä'; if (c === 'Ø') return 'Ö';
  const f = fold(c).toUpperCase();
  return /^[A-Z]$/.test(f) ? f : '#';
}
let bubbleT = null;
function alphaBubble(l){ const b = $('#alphaBubble'); b.textContent = l; b.classList.add('show'); clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove('show'), 600); }
function setupAlpha(bar, getRows, scrollTo){
  let active = false, last = '';
  const go = letter => {
    const rows = getRows(); if (!rows.length) return;
    let row = null;
    for (let k = ALPHA.indexOf(letter); k < ALPHA.length && !row; k++) row = rows.find(r => r.dataset.l === ALPHA[k]);
    if (!row) row = rows[rows.length - 1];
    scrollTo(row); alphaBubble(letter);
  };
  const at = y => { const r = bar.getBoundingClientRect(); const i = Math.max(0, Math.min(ALPHA.length - 1, Math.floor((y - r.top) / r.height * ALPHA.length))); return ALPHA[i]; };
  const pick = y => { const l = at(y); if (l !== last) { last = l; go(l); } };
  bar.addEventListener('pointerdown', e => { e.preventDefault(); active = true; last = ''; bar.classList.add('on'); try { bar.setPointerCapture(e.pointerId); } catch {} pick(e.clientY); });
  bar.addEventListener('pointermove', e => { if (active) pick(e.clientY); });
  const stop = () => { active = false; bar.classList.remove('on'); };
  bar.addEventListener('pointerup', stop); bar.addEventListener('pointercancel', stop);
  return {
    draw(show = true){
      const present = new Set(getRows().map(r => r.dataset.l));
      bar.hidden = !show || present.size === 0;
      bar.innerHTML = ALPHA.map(a => `<span class="${present.has(a) ? '' : 'off'}">${a}</span>`).join('');
      return !bar.hidden;
    },
  };
}

/* ---------- Versioner: samma titel, olika siffror/datum på slutet ---------- */
const SEP = "\\s_\\-–—.,:;()\\[\\]";
const RE_VPREFIX = new RegExp(`^(.*?)[${SEP}]+((?:version|vers|ver|v)\\.?\\s*\\d[\\d${SEP}/]*)$`, 'i');
const RE_DIGITS = new RegExp(`^(.*?)[${SEP}]*(\\d[\\d${SEP}/]*)$`);
function splitVersion(title){
  const t = String(title || '').normalize('NFC').trim();
  const m = t.match(RE_VPREFIX) || t.match(RE_DIGITS);
  if (!m || !m[1].trim()) return { base: t, suffix: '' };
  return { base: m[1].replace(new RegExp(`[${SEP}]+$`), '').trim() || m[1].trim(), suffix: m[2].replace(/^[\s(\[]+|[\s)\]]+$/g, '') };
}
const verKey = base => fold(base).replace(/[\s_\-–—.,:;()[\]]+/g, ' ').trim();
function versionGroups(){
  const g = new Map();
  for (const n of Object.values(S.noter)) {
    const { base, suffix } = splitVersion(n.titel);
    const k = verKey(base); if (!k) continue;
    if (!g.has(k)) g.set(k, []);
    g.get(k).push({ n, base, suffix });
  }
  const nums = s => (s.match(/\d+/g) || []).map(Number);
  const cmp = (a, b) => {
    if (!a.suffix !== !b.suffix) return a.suffix ? 1 : -1;
    const x = nums(a.suffix), y = nums(b.suffix);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] ?? -1) - (y[i] ?? -1); if (d) return d; }
    return (a.n.skapad || 0) - (b.n.skapad || 0);
  };
  return [...g.entries()].filter(([, v]) => v.length > 1).map(([key, v]) => {
    v.sort(cmp);
    return { key, title: v[v.length - 1].base, versions: v, ok: v.every(x => x.n.verOk) };
  }).sort((a, b) => collator.compare(a.title, b.title));
}
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('sv-SE') : '';
function listsWith(id){ return Object.values(S.listor).filter(l => l.verk.includes(id)); }
function hasAnn(id){ for (const [k, e] of S.ann) if (k.startsWith(id + '_p') && ((e.streck && e.streck.length) || (e.stopp && e.stopp.length))) return true; return false; }

  $('#verDetail').querySelectorAll('[data-vann]').forEach(b => b.onclick = () => { const n = S.noter[b.dataset.vann]; if (!n) return; if (n.medNot) delete n.medNot; else n.medNot = 1; writeNot(n.id); renderVer(); });

  $('#verDetail').querySelectorAll('[data-vopen]').forEach(b => b.onclick = () => openViewer([b.dataset.vopen], 0, 1, null));
  $('#verDel').onclick = () => confirmDeleteVersions(g, [...S.verSel]);
}
function confirmDeleteVersions(g, ids){
  const keep = g.versions.filter(v => !ids.includes(v.n.id));
  const repl = keep.length ? keep[keep.length - 1].n : null;
  const inLists = ids.filter(id => listsWith(id).length);
  const withAnn = ids.filter(hasAnn);
  openModal(`<h2>Ta bort ${ids.length} ${ids.length === 1 ? 'version' : 'versioner'}?</h2>
    <ul class="prog">${ids.map(id => `<li><span>${esc(S.noter[id]?.titel)}</span><span>${esc(fmtDate(S.noter[id]?.skapad))}</span></li>`).join('')}</ul>
    ${!keep.length ? `<p style="margin-top:12px;color:var(--err)">Du tar bort alla versioner av titeln.</p>` : ''}
    ${withAnn.length ? `<p style="margin-top:12px">${withAnn.length === 1 ? 'En av dem har' : withAnn.length + ' av dem har'} anteckningar som försvinner.</p>` : ''}
    ${inLists.length && repl ? `<label style="display:flex;gap:10px;align-items:center;min-height:44px;margin-top:8px"><input type="checkbox" id="verRepl" checked style="width:22px;height:22px"> Byt ut dem i låtlistorna mot ”${esc(repl.titel)}”</label>`
      : inLists.length ? `<p>De plockas bort ur låtlistorna.</p>` : ''}
    <p style="font-size:14px;color:var(--muted)">Det går inte att ångra.</p>
    <div class="actions"><button class="btn" id="vdNo">Avbryt</button><button class="btn danger" id="vdYes">Ta bort</button></div>`);
  $('#vdNo').onclick = closeModal;
  $('#vdYes').onclick = async () => {
    const doRepl = repl && $('#verRepl') && $('#verRepl').checked;
    $('#vdYes').disabled = true; $('#vdYes').textContent = 'Tar bort…';
    if (doRepl) {
      const del = new Set(ids);
      for (const l of Object.values(S.listor)) {
        if (!l.verk.some(x => del.has(x))) continue;
        let placed = l.verk.includes(repl.id);
        l.verk = l.verk.flatMap(x => { if (!del.has(x)) return [x]; if (placed) return []; placed = true; return [repl.id]; });
        writeList(l.id);
      }
    }
    for (const id of ids) await deleteNot(id);
    S.verSel = []; closeModal(); render();
  };
}

// Dela pdf:er (t.ex. till pianisten): filerna hämtas först, sedan öppnas iPadens dela-ruta med ett tryck.
// Safari kräver att dela-rutan öppnas direkt av ett tryck, därför två steg. Appens anteckningar följer inte med.
function pdfFileName(t, prefix){ return (prefix || '') + (String(t || 'Not').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) || 'Not') + '.pdf'; }
async function shareNotes(ids, opts = {}){
  if (MEMBER) return; // medlemsläget: noterna delas inte vidare härifrån
  ids = ids.filter(id => S.noter[id]);
  if (!ids.length) return;
  const n = ids.length, what = n === 1 ? `”${esc(S.noter[ids[0]].titel)}”` : `${n} noter`;
  openModal(`<h2>Dela pdf</h2><p id="shTxt">Hämtar ${what}…</p>
    <p style="font-size:14px;color:var(--muted)">Pdf:en delas som den laddades upp – anteckningar och bläddringspunkter du gjort i appen följer inte med.</p>
    <ul class="dupList" id="shErr"></ul>
    <div class="actions"><button class="btn" id="shNo">Avbryt</button><button class="btn primary" id="shGo" disabled>Dela</button></div>`);
  let cancelled = false;
  $('#shNo').onclick = () => { cancelled = true; closeModal(); };
  const files = [], missing = [];
  for (let i = 0; i < n; i++) {
    const id = ids[i];
    const t = $('#shTxt'); if (t && n > 1) t.textContent = `Hämtar ${i + 1} av ${n}…`;
    try {
      const buf = await getPdfBytes(id);
      const pre = opts.numbered ? String(i + 1).padStart(2, '0') + ' ' : '';
      files.push(new File([buf], pdfFileName(S.noter[id].titel, pre), { type: 'application/pdf' }));
    } catch { missing.push(S.noter[id] ? S.noter[id].titel : id); }
    if (cancelled) return;
  }
  if (cancelled || !$('#shGo')) return;
  missing.forEach(t => $('#shErr').insertAdjacentHTML('beforeend', `<li><span>${esc(t)}</span><span>kunde inte hämtas</span></li>`));
  if (!files.length) { $('#shTxt').textContent = 'Ingen fil kunde hämtas.'; $('#shGo').hidden = true; $('#shNo').textContent = 'Stäng'; return; }
  const size = files.reduce((a, f) => a + f.size, 0);
  $('#shTxt').textContent = `${files.length === 1 ? files[0].name : files.length + ' filer'} klar${files.length === 1 ? '' : 'a'} att dela (${fmtMB(size)}).`;
  const go = $('#shGo'); go.disabled = false; go.textContent = files.length === 1 ? 'Dela' : `Dela ${files.length} filer`;
  go.onclick = () => {
    const done = msg => { closeModal(); if (msg) toast2(msg); };
    if (!LOCAL) {
      // Claude-versionen: spara filerna i stället (dela-rutan når inte ut härifrån)
      (async () => { try { const dl = await window.claude.use('downloads'); for (const f of files) await dl.save({ filename: f.name, data: f }); done(`${files.length} fil${files.length === 1 ? '' : 'er'} sparad${files.length === 1 ? '' : 'e'}`); }
        catch (e) { done('Kunde inte spara: ' + (e && e.message || e)); } })();
      return;
    }
    const data = { files, title: files.length === 1 ? files[0].name.replace(/\.pdf$/, '') : (opts.title || 'Noter') };
    if (navigator.canShare && navigator.canShare({ files })) {
      navigator.share(data).then(() => done(), e => { if (e && e.name === 'AbortError') done(); else done('Kunde inte dela: ' + (e && e.message || e)); });
    } else {
      // Webbläsare utan dela-ruta: ladda ner filerna en och en
      files.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 30000); }, i * 400));
      done(`${files.length} fil${files.length === 1 ? '' : 'er'} laddas ner`);
    }
  };
}

function bulkAdd(ids){
  if (!ids.length) return;
  const lists = Object.values(S.listor).sort((a, b) => (b.datum || '').localeCompare(a.datum || '') || collator.compare(a.namn, b.namn));
  const chosenLists = new Set();
  openModal(`<h2>Lägg till ${ids.length} ${ids.length === 1 ? 'not' : 'noter'}</h2>
    <div class="field">Körer <span style="font-size:13px">– läggs till, noternas nuvarande körer finns kvar</span><div id="bkKor"></div></div>
    <div class="field" style="margin-top:14px">Låtlistor <span style="font-size:13px">– noterna läggs sist, i den ordning du valde dem</span>
      <div class="chips" id="bkLists" style="margin:6px 0 0"></div>
      <input class="search" id="bkNewList" placeholder="…eller skriv namnet på en ny låtlista" style="color:var(--fg)">
    </div>
    <div class="actions"><button class="btn" id="bkNo">Avbryt</button><button class="btn primary" id="bkOk">Lägg till</button></div>`);
  const picker = korPicker($('#bkKor'), []);
  const drawLists = () => {
    $('#bkLists').innerHTML = lists.length ? lists.map(l => `<button type="button" class="chip" data-l="${esc(l.id)}" aria-pressed="${chosenLists.has(l.id)}">${chosenLists.has(l.id) ? '✓ ' : ''}${folderOf(l) ? '📁 ' + esc(S.mappar[l.mapp].namn) + ' / ' : ''}${esc(l.namn)}${l.datum ? ' · ' + esc(l.datum) : ''}</button>`).join('')
      : `<span style="font-size:14px">Inga låtlistor än.</span>`;
    $('#bkLists').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const id = b.dataset.l; chosenLists.has(id) ? chosenLists.delete(id) : chosenLists.add(id); drawLists(); });
  };
  drawLists();
  $('#bkNo').onclick = closeModal;
  $('#bkOk').onclick = () => {
    const korer = picker.get(), newName = $('#bkNewList').value.trim();
    if (!korer.length && !chosenLists.size && !newName) { toastLib('Välj en kör eller en låtlista först'); return; }
    let korCount = 0;
    if (korer.length) for (const id of ids) {
      const n = S.noter[id]; if (!n) continue;
      const before = korerOf(n), merged = [...new Set([...before, ...korer])];
      if (merged.length !== before.length) { const rank = k => KORER.includes(k) ? KORER.indexOf(k) : 99; n.korer = merged.sort((x, y) => rank(x) - rank(y) || collator.compare(x, y)); writeNot(id); korCount++; }
    }
    const listNames = [];
    if (newName) {
      const id = newId('l'), now = Date.now();
      S.listor[id] = { id, namn: newName.slice(0, 200), datum: '', verk: [], skapad: now, uppdaterad: now };
      chosenLists.add(id);
    }
    let added = 0;
    for (const lid of chosenLists) {
      const l = S.listor[lid]; if (!l) continue;
      const toAdd = ids.filter(id => S.noter[id] && !l.verk.includes(id));
      l.verk = [...l.verk, ...toAdd]; added += toAdd.length; listNames.push(l.namn);
      writeList(lid);
    }
    closeModal(); setSelMode(false); render();
    const parts = [];
    if (korer.length) parts.push(`${korer.join(', ')} lades till på ${korCount} ${korCount === 1 ? 'not' : 'noter'}`);
    const names = listNames.map(n => '”' + n + '”'); const nameStr = names.length > 1 ? names.slice(0, -1).join(', ') + ' och ' + names[names.length - 1] : names[0];
    if (listNames.length) parts.push(added ? `${ids.length === 1 ? 'Noten' : 'Noterna'} lades i ${nameStr}` : `${ids.length === 1 ? 'Noten' : 'Noterna'} fanns redan i ${nameStr}`);
    infoBox('Klart', parts.join('. ') + '.');
  };
}
let libToastT = null;
function toastLib(t){ const b = $('#bkOk'); if (!b) return; const old = b.textContent; b.textContent = t; clearTimeout(libToastT); libToastT = setTimeout(() => { if ($('#bkOk')) $('#bkOk').textContent = old; }, 1800); }

const folderOf = l => (l.mapp && S.mappar[l.mapp]) ? l.mapp : '';

function renderListor(){

  if (S.openFolder && !S.mappar[S.openFolder]) S.openFolder = null;

      $('#fDelete').onclick = () => confirmBox('Ta bort mappen?', `Mappen ”${esc(f.namn)}” tas bort. Låtlistorna i den finns kvar och hamnar bland alla låtlistor.`, 'Ta bort', () => {
        for (const l of Object.values(S.listor)) if (l.mapp === f.id) { l.mapp = ''; writeList(l.id); }

// Dra och släpp i låtlistan (fungerar med finger, penna och mus)
function startListDrag(e, handle, idx, listId){
  if (S.dragging || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const el = $('#ldItems'), rows = [...el.querySelectorAll('.row')];
  const rects = rows.map(r => r.getBoundingClientRect());
  const row = rows[idx], h = rects[idx].height;
  const startY = e.clientY, scroll0 = window.scrollY;
  let lastY = e.clientY, target = idx, raf = 0;
  S.dragging = true;
  try { handle.setPointerCapture(e.pointerId); } catch {}
  row.classList.add('dragging');
  rows.forEach((r, i) => { if (i !== idx) r.classList.add('shifting'); });
  const update = () => {
    const dy = lastY - startY + (window.scrollY - scroll0);
    row.style.transform = `translateY(${dy}px)`;
    const center = rects[idx].top + h / 2 + dy;
    target = idx;
    rects.forEach((r, i) => { const mid = r.top + r.height / 2; if (i < idx && center < mid) target = Math.min(target, i); if (i > idx && center > mid) target = Math.max(target, i); });
    rows.forEach((r, i) => {
      if (i === idx) return;
      const shift = (idx < target && i > idx && i <= target) ? -h : (target < idx && i >= target && i < idx) ? h : 0;
      r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  };
  const tick = () => {
    const edge = 90, H = window.innerHeight;
    let v = 0; if (lastY < edge) v = -Math.ceil((edge - lastY) / 6); else if (lastY > H - edge) v = Math.ceil((lastY - (H - edge)) / 6);
    if (v) { window.scrollBy(0, v); update(); }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  const move = ev => { if (ev.pointerId !== e.pointerId) return; lastY = ev.clientY; update(); };
  const end = ev => {
    if (ev.pointerId !== e.pointerId) return;
    cancelAnimationFrame(raf);
    handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', end); handle.removeEventListener('pointercancel', end);
    rows.forEach(r => { r.style.transform = ''; r.classList.remove('dragging', 'shifting'); });
    S.dragging = false;
    const m = S.listor[listId];
    if (m && target !== idx && ev.type === 'pointerup') { const v = m.verk.slice(); v.splice(target, 0, v.splice(idx, 1)[0]); m.verk = v; writeList(listId); }
    renderListItems();
  };
  handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
}

  removeFromUploadQueue(id);
  forgetDoc(id); IDB.del('pdf', id); S.cached.delete(id);
  const range = IDBKeyRange.bound(id + '_p', id + '_p￿');
  const keys = new Set(await IDB.keys('ann', range));
  for (const k of [...S.ann.keys()]) if (k.startsWith(id + '_p')) keys.add(k);
  if (S.db) { try { const snap = await withTimeout(S.db.collection('anteckningar').where('not', '==', id).get(), 10000); snap.docs.forEach(d => keys.add(d.id)); } catch {} }

  render();
}

async function sha256(buf){
  try { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch { return ''; }
}
// Hitta dubbletter: exakt samma fil (innehåll) eller samma titel som en befintlig not
async function findDuplicates(files, bufs, shas){

  const notes = Object.values(S.noter);
  // Räkna fram fingeravtryck för befintliga noter av samma storlek som saknar det (bara de som finns på enheten)
  const sizes = new Set(files.map(f => f.size));
  for (const n of notes) {
    if (n.sha || !sizes.has(n.storlek) || !S.cached.has(n.id)) continue;
    const b = await IDB.get('pdf', n.id); if (!b) continue;
    const h = await sha256(b); if (h) { n.sha = h; writeNot(n.id); }
  }
  files.forEach((f, i) => {
    const sha = shas[i], title = fold(titleFromName(f.name));
    const same = notes.find(n => (sha && n.sha && n.sha === sha) || (!n.sha && n.storlek === f.size && fold(n.filnamn) === fold(f.name)));
    const earlier = files.slice(0, i).findIndex((g, k) => (sha && shas[k] === sha) || (!sha && g.size === f.size && g.name === f.name));
    const titled = !same && notes.find(n => fold(n.titel) === title);
    out.push(same ? { kind: 'samma', note: same } : earlier >= 0 ? { kind: 'batch', other: earlier } : titled ? { kind: 'titel', note: titled } : null);
  });
  return out;
}

async function addFiles(files, korer, target = null, plan = [], bufs = [], shas = []){

          if (!m.verk.includes(ex.id)) { m.verk = [...m.verk, ex.id]; writeList(target); renderListItems(); set('Fanns redan – lagd i listan'); }
          else set('Fanns redan i listan');
        } else set('Hoppades över');
        continue;
      }
      set('Läser…');
      const buf = bufs[i] || await f.arrayBuffer();
      let sidor = 0;

      const n = { id, titel: titleFromName(f.name), korer, filnamn: f.name, storlek: buf.byteLength, sidor, asset: null, sha: shas[i] || await sha256(buf), skapad: now, uppdaterad: now };
      S.noter[id] = n;
      if (S.assets) {
        set('Laddar upp…');
        try { const r = await withTimeout(S.assets.upload(new Blob([buf], {type:'application/pdf'}), {type:'application/pdf'}), 180000); n.asset = r.id; }
        catch (e) { if (e && e.code === 'too_large') n.molnfel = true; }
      }
      if (!n.asset && !stored) { delete S.noter[id]; set('Kunde inte sparas'); continue; }
      if (!LOCAL && !n.asset && !n.molnfel) { S.uploadQueue.push(id); IDB.put('kv','uploadQueue',S.uploadQueue); }

/* ---------- Säkerhetskopia (zip-fil med noter + allt annat) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
// Okomprimerad zip (pdf:er komprimeras ändå inte mycket); kan öppnas på Mac/PC
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;

    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name);
    off += 30 + name.length + data.length;
  }
  const cSize = central.reduce((a, b) => a + (b.byteLength ?? b.length), 0);

  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cSize, true); e.setUint32(16, off, true);

function unzipStore(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1; for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }

  const count = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const out = {};
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Säkerhetskopian är skadad.');
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));

    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    out[name] = u8.subarray(ds, ds + size);

}
async function allAnnotations(){
  const keys = await IDB.keys('ann'), vals = await IDB.all('ann'), all = {};
  keys.forEach((k, i) => { if (vals[i]) all[k] = vals[i]; });
  for (const [k, e] of S.ann) if (!all[k] || (e.uppdaterad || 0) > (all[k].uppdaterad || 0)) all[k] = e;
  if (S.db) {
    try {
      const snap = await withTimeout(S.db.collection('anteckningar').get(), 30000);
      for (const d of snap.docs) { const r = d.data() || {}; if (!all[d.id] || (+r.uppdaterad || 0) > (all[d.id].uppdaterad || 0)) all[d.id] = { not: r.not, sida: r.sida, streck: cleanStrokes(r.streck), stopp: cleanStops(r.stopp), uppdaterad: +r.uppdaterad || 0 }; }
    } catch {}
  }
  for (const k of Object.keys(all)) if (!S.noter[k.split('_p')[0]]) delete all[k];
  return all;
}

/* ---------- Hemskärmsappen: offline via service worker och uppdateringar ---------- */
function setupServiceWorker(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    const offer = w => {
      if (!w || $('#updBar')) return;
      const bar = document.createElement('div'); bar.id = 'updBar';
      bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:80;background:#1f1c18;color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)';
      bar.innerHTML = '<span>En ny version av Notstället finns.</span><button class="btn primary" id="updGo">Uppdatera</button><button class="btn" id="updLater" style="background:transparent;color:#fff;border-color:#555">Senare</button>';
      document.body.appendChild(bar);
      $('#updGo').onclick = () => { w.postMessage('skipWaiting'); bar.remove(); };
      $('#updLater').onclick = () => bar.remove();
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    // leta efter uppdateringar när appen öppnas igen
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

const V = {

  touches: new Map(), pinch: null,
  open: false, queue: [], qi: 0, page: 1, numPages: 0, listId: null, token: 0,
  tool: 'pen', penColor: COLORS[0][0], hlColor: HL_COLORS[0][0], width: 'fin', finger: false,
  undo: [], redo: [], stroke: null, gesture: null, pageW: 0, pageH: 0, inkDpr: 1, barShown: false,
};
const stage = $('#stage'), wrap = $('#pagewrap'), slot = $('#pageslot'), inkcv = $('#inkcv'), livecv = $('#livecv');
const pageCache = new Map(); // key -> Promise<{cv,w,h}>

function annKey(id = V.queue[V.qi], page = V.page){ return id + '_p' + page; }

function openViewer(queue, qi, page, listId){
  Object.assign(V, { open: true, queue, qi, page, listId, undo: [], redo: [], stroke: null, gesture: null, tool: V.tool === 'erase' ? 'pen' : V.tool });
  $('#viewer').hidden = false; showBar(false);

  $('#vlist').hidden = true;

function closeViewer(){
  V.open = false; V.token++; hideUndo(); hideSwap(); toolPop(false); $('#zoomPill').hidden = true; mStop(); $('#metro').hidden = true; $('#metroDot').hidden = true; V.zoomFor = null; V.pinch = null; V.touches.clear();
  $('#viewer').hidden = true;
  for (const p of pageCache.values()) p.then(r => { r.cv.width = 0; r.cv.height = 0; }).catch(() => {});
  pageCache.clear(); slot.replaceChildren();
  render();
}

function stageSize(){ return { W: stage.clientWidth, H: stage.clientHeight }; }

async function renderPageCanvas(doc, id, pageNo){
  const page = await doc.getPage(pageNo);
  const vp1 = page.getViewport({ scale: 1 });
  const { W, H } = stageSize();
  const s = ((W > H && S.settings.fillWidth) ? W / vp1.width : Math.min(W / vp1.width, H / vp1.height)) * V.zoom;
  const w = Math.max(1, Math.floor(vp1.width * s)), h = Math.max(1, Math.floor(vp1.height * s));
  let dpr = Math.min(window.devicePixelRatio || 1, 3);
  const maxPx = 12e6; if (w * h * dpr * dpr > maxPx) dpr = Math.sqrt(maxPx / (w * h));
  const key = `${id}:${pageNo}:${w}x${h}:${dpr.toFixed(2)}`;
  if (pageCache.has(key)) { const p = pageCache.get(key); pageCache.delete(key); pageCache.set(key, p); return p; }
  const p = (async () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    await page.render({ canvas: cv, viewport: page.getViewport({ scale: s * dpr }) }).promise;
    return { cv, w, h, key };
  })();
  p.catch(() => pageCache.delete(key));
  pageCache.set(key, p);
  while (pageCache.size > 3) {
    const [k, old] = pageCache.entries().next().value;
    pageCache.delete(k);
    old.then(r => { if (!r.cv.isConnected) { r.cv.width = 0; r.cv.height = 0; } }).catch(() => {});
  }
  return p;
}

function showMsg(text){ wrap.hidden = true; const m = $('#vmsg'); m.hidden = false; m.textContent = text; }

async function showPage(opts = {}){
  const token = ++V.token;
  const id = V.queue[V.qi];
  const n = S.noter[id];
  updateBar();
  let doc;
  try { doc = await getDoc(id); }
  catch (e) { if (token === V.token) { V.numPages = 0; showMsg((n ? n.titel + ': ' : '') + (e.message || 'Kunde inte öppna noten.')); showBar(true); } return; }
  if (token !== V.token) return;
  V.numPages = doc.numPages;
  if (V.page === -1 || V.page > V.numPages) V.page = V.numPages;
  if (V.page < 1) V.page = 1;
  if (n && n.sidor !== doc.numPages) { n.sidor = doc.numPages; writeNot(id); }
  loadAnn(id);
  const orient = curOrient();
  if (V.zoomFor !== id || V.zoomOrient !== orient) {
    const sz = ZOOM_ON ? savedZoom(n) : null;
    if (V.zoomFor !== id) { applyNoteTempo(n); if (n && !n.tempo && (n.tempoKoll || 0) < TEMPO_V) autoTempo(doc, id); }
    V.zoom = sz ? sz.z : 1; V.offXFrac = sz ? sz.x : 0.5; V.zoomFor = id; V.zoomOrient = orient; V.applyFrac = true; V.pendingOff = null;
  }
  let r;
  try { r = await renderPageCanvas(doc, id, V.page); }
  catch (e) { if (token === V.token) showMsg('Sidan kunde inte visas.'); return; }
  if (token !== V.token) return;
  $('#vmsg').hidden = true; wrap.hidden = false;
  slot.replaceChildren(r.cv);
  V.pageW = r.w; V.pageH = r.h;
  wrap.style.width = r.w + 'px'; wrap.style.height = r.h + 'px';
  V.inkDpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(6e6 / (r.w * r.h)));
  for (const c of [inkcv, livecv]) { c.width = Math.round(r.w * V.inkDpr); c.height = Math.round(r.h * V.inkDpr); c.style.width = r.w + 'px'; c.style.height = r.h + 'px'; }
  drawInk(); clearLive();
  const frac = V.minY < 0 ? V.offY / V.minY : 0;
  computeBounds();
  stopInertia();
  if (opts.keepOff && V.pendingOff) {
    V.offX = clampX(V.pendingOff.x); V.offY = clampY(V.pendingOff.y); V.pendingOff = null;
  } else {
  V.offX = V.applyFrac ? (V.wide ? Math.round(V.minX * V.offXFrac) : V.minX) : clampX(V.offX);
  V.applyFrac = false;
  const endStops = V.startAt === 'end' ? pageStops() : [];
  V.offY = !V.tall ? V.minY : V.startAt === 'end' ? (endStops.length ? (V.lowY = Math.min(V.minY, -endStops[endStops.length - 1]), clampY(-endStops[endStops.length - 1])) : V.minY) : opts.keepSeg ? Math.round(V.minY * Math.min(1, Math.max(0, frac || 0))) : 0;
  }
  V.startAt = 0;
  placeWrap(false);
  if (V.flipDir) { const d = V.flipDir; V.flipDir = 0; if (flipFx(d)) slideIn(d); }
  updateBar(); updateZoomPill();
  if (!opts.quiet) toast(pageLabel());
  prefetch(doc, id);
}

// Liggande läge: sidan fyller bredden och kan dras fritt uppåt/nedåt
function computeBounds(){
  const { W, H } = stageSize(), h = V.pageH;
  V.wide = V.pageW > W + 1;
  V.minX = V.wide ? Math.round(W - V.pageW) : Math.round((W - V.pageW) / 2);
  V.tall = h > H + 1;
  V.minY = V.tall ? Math.round(H - h) : Math.round((H - h) / 2); // högsta tillåtna förskjutning uppåt
  V.lowY = V.minY; // kan sänkas tillfälligt när en bläddringspunkt långt ner ska hamna överst (vitt under sidan)
}
const clampY = y => V.tall ? Math.min(0, Math.max(V.lowY, y)) : V.minY;
// Gå till en bläddringspunkt: punkten hamnar alltid i skärmens överkant, även om det blir vitt under sidan
function goToStop(t, anim = true){ V.lowY = Math.min(V.minY, -t); V.offY = clampY(-t); placeWrap(anim); }
const clampX = x => V.wide ? Math.min(0, Math.max(V.minX, x)) : V.minX;
function placeWrap(anim){
  const { W, H } = stageSize();
  if (V.slideAnim) { V.slideAnim.cancel(); V.slideAnim = null; }
  wrap.classList.toggle('anim', anim === true);
  wrap.classList.toggle('anim2', anim === 'slow');
  wrap.style.transform = `translate(${Math.round(V.wide ? V.offX : V.minX)}px, ${Math.round(V.offY)}px)`;
  const sc = $('#vscroll');
  sc.hidden = !V.tall;
  if (V.tall) {
    const th = sc.querySelector('i'), y = Math.min(0, Math.max(V.minY, V.offY));
    th.style.transition = anim ? '' : 'none';
    th.style.height = (H / V.pageH * 100) + '%'; th.style.top = (-y / V.pageH * 100) + '%';
  }
}
let inertiaRaf = 0;
function stopInertia(){ if (inertiaRaf) cancelAnimationFrame(inertiaRaf); inertiaRaf = 0; }
function glide(v){ // v = px per ms
  stopInertia();
  let last = performance.now();
  const step = now => {
    const dt = Math.min(40, now - last); last = now;
    V.offY += v * dt; v *= Math.pow(0.994, dt);
    const c = clampY(V.offY);
    if (c !== V.offY) { V.offY = c; v = 0; }
    placeWrap(false);
    inertiaRaf = Math.abs(v) > 0.02 ? requestAnimationFrame(step) : 0;
  };
  inertiaRaf = requestAnimationFrame(step);
}

/* ---------- Metronom: klick (Web Audio) och blinkande punkt ---------- */
const M = { on: false, bpm: 100, beats: 4, sound: true, blink: true, ctx: null, next: 0, beat: 0, timer: null, queue: [], raf: 0, taps: [], fadeT: null };
Object.assign(M, (S.settings && S.settings.metro) || {});
const mNow = () => M.ctx ? M.ctx.currentTime : performance.now() / 1000;
function mSaveSettings(){ S.settings.metro = { bpm: M.bpm, beats: M.beats, sound: M.sound, blink: M.blink }; IDB.put('kv', 'settings', S.settings); }
function mClick(t, accent){
  try {
    const o = M.ctx.createOscillator(), g = M.ctx.createGain();
    o.type = 'square'; o.frequency.value = accent ? 1760 : 1100;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.32, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    o.connect(g); g.connect(M.ctx.destination); o.start(t); o.stop(t + 0.06);
  } catch {}
}
function mSchedule(){
  while (M.next < mNow() + 0.12) {
    const accent = M.beats > 1 && M.beat === 0;
    if (M.sound && M.ctx) mClick(M.next, accent);
    M.queue.push({ t: M.next, accent });
    M.next += 60 / M.bpm;
    M.beat = (M.beat + 1) % Math.max(1, M.beats);
  }
}
function mDraw(){
  const t = mNow(); let cur = null;
  while (M.queue.length && M.queue[0].t <= t) cur = M.queue.shift();
  if (cur && M.blink) {
    const d = $('#metroDot');
    d.classList.remove('fade'); d.classList.add('hit'); d.classList.toggle('acc', cur.accent);
    clearTimeout(M.fadeT);
    M.fadeT = setTimeout(() => { d.classList.add('fade'); d.classList.remove('hit', 'acc'); }, Math.min(120, 30000 / M.bpm));
  }
  if (M.on) M.raf = requestAnimationFrame(mDraw);
}
function mStart(){
  try {
    if (!M.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) M.ctx = new AC(); }
    if (M.ctx && M.ctx.resume) M.ctx.resume().catch(() => {});
  } catch { M.ctx = null; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {} // spela även när iPaden står på ljudlöst
  M.on = true; M.beat = 0; M.queue = [];
  M.next = mNow() + 0.08;
  clearInterval(M.timer); M.timer = setInterval(mSchedule, 25); mSchedule();
  cancelAnimationFrame(M.raf); M.raf = requestAnimationFrame(mDraw);
  renderMetro();
}
function mStop(){
  M.on = false; clearInterval(M.timer); cancelAnimationFrame(M.raf); M.queue = [];
  renderMetro();
}
function setBpm(v, save = true){
  M.bpm = Math.max(20, Math.min(300, Math.round(+v || M.bpm)));
  renderMetro(); if (save) mSaveSettings();
}
function renderMetro(){
  const panelOpen = !$('#metro').hidden;
  $('#metroDot').hidden = !(M.on && M.blink && V.open);
  const cn = V.open && S.noter[V.queue[V.qi]];
  const vb = $('#vMetro'); vb.classList.toggle('on', M.on); vb.textContent = (M.on || (cn && cn.tempo)) ? `♩ ${M.bpm}` : '♩ Metronom';
  if (!panelOpen) return;
  const pl = $('#mPlay'); pl.classList.toggle('on', M.on); pl.textContent = M.on ? '■ Stopp' : '▶ Start';
  if (document.activeElement !== $('#mBpm')) $('#mBpm').value = M.bpm;
  $('#mSlider').value = M.bpm;
  $('#mBeats').value = String(M.beats);
  $('#mSound').setAttribute('aria-pressed', M.sound); $('#mBlink').setAttribute('aria-pressed', M.blink);
  const n = S.noter[V.queue[V.qi]];
  $('#mSaveTempo').textContent = n && n.tempo === M.bpm ? (n.tempoSrc === 'not' ? `✓ ${M.bpm} lästes från noten` : `✓ ${M.bpm} sparat för noten`) : 'Spara tempo för noten';
}
$('#vMetro').onclick = () => { const p = $('#metro'); p.hidden = !p.hidden; renderMetro(); };
$('#mClose').onclick = () => { $('#metro').hidden = true; renderMetro(); };
$('#mPlay').onclick = () => M.on ? mStop() : mStart();
$('#mMinus').onclick = () => setBpm(M.bpm - 1);
$('#mPlus').onclick = () => setBpm(M.bpm + 1);
$('#mSlider').oninput = e => setBpm(e.target.value, false);

$('#mBpm').onchange = e => setBpm(e.target.value);
